name: Build Union G2A VDF
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Build-Windows.ps1'
      - '.github/workflows/build.yml'
jobs:
  quest-status-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test quest status evaluation
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror tests/kondehra_status.cpp -o kondehra_status
          ./kondehra_status
          c++ -std=c++17 -Wall -Wextra -Werror tests/chapter2_status.cpp -o chapter2_status
          ./chapter2_status
  build:
    needs: quest-status-tests
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile G2A Union plugin and VDF
        shell: powershell
        run: ./Build-Windows.ps1
      - name: Publish Windows VDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: OdysseeQuestInspector-G2A-Union
          path: release/OdysseeQuestInspector.vdf
          if-no-files-found: error
