name: Build Union G2A VDF
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Build-Windows.ps1'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile G2A Union plugin and VDF
        shell: powershell
        run: ./Build-Windows.ps1
      - name: Publish Windows VDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: OdysseeQuestInspector-G2A-Union
          path: release/OdysseeQuestInspector.vdf
          if-no-files-found: error
